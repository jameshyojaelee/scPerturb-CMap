package:
  name: scperturb-cmap
  version: 0.2.0

source:
  url: https://github.com/jameslee/scPerturb-CMap/releases/download/v0.2.0/scperturb_cmap-0.2.0.tar.gz
  sha256: 657dab71017599188fb59a8bd3bd73455af886d00f7cd47c771cb0bfe6f9957b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.10
    - anndata
    - scanpy
    - pandas
    - numpy
    - scikit-learn
    - pytorch
    - umap-learn
    - gseapy
    - pydantic >=2
    - plotly
    - streamlit
    - hydra-core
    - pyarrow
    - typer

test:
  commands:
    - scperturb-cmap --help

about:
  summary: single-cell connectivity mapping toolkit for drug repurposing
  license: MIT
  home: https://github.com/jameslee/scPerturb-CMap

extra:
  recipe-maintainers:
    - jameslee
