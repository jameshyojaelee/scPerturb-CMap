name: docs

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material
      - name: Build site
        run: |
          mkdocs build --strict

