name: release-testpypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 0.1.0)"
        required: true

jobs:
  build-and-publish-testpypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install build twine
          pip install -e .[dev]
      - name: Lint
        run: . .venv/bin/activate && ruff check src tests
      - name: Test
        run: . .venv/bin/activate && pytest -q
      - name: Build
        run: . .venv/bin/activate && python -m build
      - name: Twine check
        run: . .venv/bin/activate && twine check dist/*
      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: . .venv/bin/activate && twine upload --repository-url https://test.pypi.org/legacy/ dist/*

