{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scperturb-cmap.fullname" . }}-api
  labels:
    {{- include "scperturb-cmap.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "scperturb-cmap.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "scperturb-cmap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "scperturb-cmap.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: api
        image: {{ include "scperturb-cmap.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["uvicorn"]
        args:
          - "api.main:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--workers"
          - "{{ .Values.api.env | first | pluck "value" | first | default "4" }}"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        {{- range .Values.api.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        - name: REDIS_URL
          value: {{ include "scperturb-cmap.redisUrl" . | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "scperturb-cmap.fullname" . }}-secrets
              key: database-url
        livenessProbe:
          {{- toYaml .Values.api.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.api.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        volumeMounts:
        - name: lincs-data
          mountPath: {{ .Values.persistence.lincsData.mountPath }}
          readOnly: true
        - name: model-artifacts
          mountPath: {{ .Values.persistence.modelArtifacts.mountPath }}
          readOnly: true
        - name: cache
          mountPath: {{ .Values.persistence.cache.mountPath }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      - name: lincs-data
        {{- if .Values.persistence.lincsData.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.lincsData.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "scperturb-cmap.fullname" . }}-lincs-data
        {{- end }}
      - name: model-artifacts
        {{- if .Values.persistence.modelArtifacts.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.modelArtifacts.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "scperturb-cmap.fullname" . }}-model-artifacts
        {{- end }}
      - name: cache
        {{- if .Values.persistence.cache.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.cache.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "scperturb-cmap.fullname" . }}-cache
        {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
