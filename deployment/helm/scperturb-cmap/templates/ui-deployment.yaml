{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scperturb-cmap.fullname" . }}-ui
  labels:
    {{- include "scperturb-cmap.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "scperturb-cmap.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "scperturb-cmap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "scperturb-cmap.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: ui
        image: {{ include "scperturb-cmap.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["streamlit", "run"]
        args:
          - "--server.address=0.0.0.0"
          - "--server.port=8501"
          - "/usr/local/lib/python3.10/site-packages/scperturb_cmap/ui/app.py"
        ports:
        - name: http
          containerPort: 8501
          protocol: TCP
        env:
        - name: SCPC_DATA_DIR
          value: "/data"
        - name: SCPC_CACHE_DIR
          value: "/app/workspace/cache"
        - name: SCPC_LINCS
          value: "/data/lincs/partitioned"
        - name: API_URL
          value: "http://{{ include "scperturb-cmap.fullname" . }}-api:8000"
        livenessProbe:
          {{- toYaml .Values.ui.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.ui.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        volumeMounts:
        - name: lincs-data
          mountPath: {{ .Values.persistence.lincsData.mountPath }}
          readOnly: true
        - name: model-artifacts
          mountPath: {{ .Values.persistence.modelArtifacts.mountPath }}
          readOnly: true
        - name: cache
          mountPath: {{ .Values.persistence.cache.mountPath }}
      volumes:
      - name: lincs-data
        {{- if .Values.persistence.lincsData.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.lincsData.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "scperturb-cmap.fullname" . }}-lincs-data
        {{- end }}
      - name: model-artifacts
        {{- if .Values.persistence.modelArtifacts.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.modelArtifacts.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "scperturb-cmap.fullname" . }}-model-artifacts
        {{- end }}
      - name: cache
        {{- if .Values.persistence.cache.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.cache.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "scperturb-cmap.fullname" . }}-cache
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
