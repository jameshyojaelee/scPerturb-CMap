site_name: scPerturb-CMap
site_description: Single-cell connectivity mapping toolkit for drug repurposing
site_url: https://scperturb-cmap.readthedocs.io
site_dir: workspace/site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart: quickstart.md

  - User Guide:
    - CLI Reference: cli.md
    - API Reference: api.md
    - Explainability Framework: explainability.md
    - HPC Deployment: hpc.md

  - Case Studies:
    - Overview: cases/index.md
    - NSCLC CD8+ T Cell Exhaustion: cases/nsclc_cd8.md
    - EMT in Breast Cancer: cases/emt_breast.md
    - IFN-high Macrophages: cases/ifn_macrophage.md

  - Deployment:
    - Overview: deployment/README.md
    - Cloud Guide: deployment/CLOUD_DEPLOYMENT.md

  - Development:
    - Contributing Guide: contributing/CONTRIBUTING.md
    - Contributor FAQ: contributing/README.md
    - Explainability Dev Notes: contributing/EXPLAINABILITY_SUMMARY.md

  - Reference:
    - Guides Overview: guides/README.md
    - Changelog: guides/CHANGELOG.md
    - Roadmap: guides/ROADMAP.md
    - Data Notes: guides/DATA_NOTES.md
    - Explainability Features: guides/EXPLAINABILITY_FEATURES.md
    - Architecture: architecture/README.md
    - Repository Structure: reference/repository_structure.md

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jameslee/scPerturb-CMap
  version:
    provider: mike
